<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a class="brand" href="/index.html">{{ site.title }}</a>
    <nav>{% for item in site.navigation %}<a href="{{ item.url }}">{{ item.title }}</a>{% endfor %}</nav>
  </header>
  <main>
    <h1>{{ page.title }}</h1>
    {{{ content }}}
    <aside>{% for tag in page.tags %}<a class="tag" href="{{ tag.url }}">{{ tag.name }}</a>{% endfor %}</aside>
  </main>
  <footer><a href="/rss.xml">RSS feed</a></footer>
</body>
</html>
